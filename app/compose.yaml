name: ${COMPOSE_PROJECT_NAME:-sas-san}
services:
    app:
        build: .
        ports: ['127.0.0.1:${APP_PORT:-8000}:8000']
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - composer_cache:/root/.composer/cache
        depends_on:
            db:
                condition: service_healthy
        environment:
            DB_HOST: db
    db:
        image: postgres:18.6-bookworm
        environment:
            POSTGRES_DB: sas_san
            POSTGRES_USER: sas_owner
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
        volumes: ['postgres_data:/var/lib/postgresql']
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U sas_owner -d sas_san']
            interval: 5s
            retries: 20
    scheduler:
        build: .
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
        environment:
            DB_HOST: db
        depends_on:
            db:
                condition: service_healthy
    worker:
        build: .
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=3',
                '--tries=3',
                '--timeout=90',
            ]
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
        environment:
            DB_HOST: db
        depends_on:
            db:
                condition: service_healthy
volumes:
    postgres_data:
    vendor_data:
    composer_cache:
