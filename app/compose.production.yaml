name: ${COMPOSE_PROJECT_NAME:?Defina un proyecto exclusivo}
x-runtime: &runtime
    build:
        context: .
        dockerfile: Dockerfile.production
        target: app
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:?Indique el archivo privado de entorno}
    environment:
        DB_HOST: db
        DB_USERNAME: sas_runtime
        DB_PASSWORD_FILE: /run/secrets/runtime_password
        APP_KEY_FILE: /run/secrets/app_key
    secrets: [runtime_password, app_key]
    volumes: [private_storage:/var/www/html/storage]
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
services:
    app:
        <<: *runtime
        depends_on:
            db:
                condition: service_healthy
    scheduler:
        <<: *runtime
        command: ['php', 'artisan', 'schedule:work']
        depends_on: [app]
    worker:
        <<: *runtime
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=3',
                '--tries=3',
                '--timeout=90',
            ]
        depends_on: [app]
    migrate:
        <<: *runtime
        restart: 'no'
        profiles: [setup]
        environment:
            DB_HOST: db
            DB_USERNAME: sas_owner
            DB_PASSWORD_FILE: /run/secrets/owner_password
            APP_KEY_FILE: /run/secrets/app_key
            RUNTIME_DB_PASSWORD_FILE: /run/secrets/runtime_password
        secrets: [owner_password, runtime_password, app_key]
        command:
            [
                'sh',
                '-c',
                'php artisan migrate --force && php artisan business:provision-runtime',
            ]
        depends_on:
            db:
                condition: service_healthy
    web:
        build:
            context: .
            dockerfile: Dockerfile.production
            target: web
        restart: unless-stopped
        environment:
            DOMAIN: ${DOMAIN:?Indique un dominio configurado}
            TLS_EMAIL: ${TLS_EMAIL:?Indique contacto TLS}
        ports: ['80:80', '443:443']
        networks: [backend, edge]
        volumes: [tls_data:/data, tls_config:/config]
        depends_on: [app]
        security_opt: [no-new-privileges:true]
    db:
        image: postgres:18.6-bookworm
        restart: unless-stopped
        environment:
            POSTGRES_DB: sas_san
            POSTGRES_USER: sas_owner
            POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
        secrets: [owner_password]
        volumes: [postgres_data:/var/lib/postgresql]
        networks: [backend]
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U sas_owner -d sas_san']
            interval: 5s
            timeout: 5s
            retries: 30
networks:
    backend:
    edge:
volumes:
    postgres_data:
    private_storage:
    tls_data:
    tls_config:
secrets:
    owner_password:
        file: ${OWNER_PASSWORD_FILE:?Archivo privado requerido}
    runtime_password:
        file: ${RUNTIME_PASSWORD_FILE:?Archivo privado requerido}
    app_key:
        file: ${APP_KEY_FILE:?Archivo privado requerido}
